services:
  - type: web
    name: la-meute
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn main:app --workers 1 --threads 4 --timeout 120

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: CHANNEL_ID
        value: "@lameute_insoumise"

      - key: PORT
        value: "10000"
